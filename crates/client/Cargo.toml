[package]
name = "httpcli"
version = "0.7.1"
edition = "2024"
description = "Http client"
authors = ["Saúl Valdelvira <saul@saulv.es>"]
license = "GPL-3.0-only"
repository = "https://github.com/saulvaldelvira/http-server"

[[bin]]
name = "http-client"
path = "src/main.rs"

[dependencies]
http.workspace = true
webpki-roots = { version = "1.0.1", optional = true }

# ==== GUI =====
egui = { version = "0.36.0", optional = true }
eframe = { version = "0.36.0", features = ["persistence"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
jsonrs = { version = ">=1.5.1", git = "https://github.com/saulvaldelvira/json.rs", optional = true }
# ==============

[dependencies.rustls]
version = ">=0.23.28"
optional = true
default-features = false
features = ["std", "aws_lc_rs"]

[features]
default = []
tls = ["dep:rustls", "dep:webpki-roots", "http/tls"]
gui = ["dep:egui", "dep:eframe", "dep:serde", "dep:jsonrs"]
